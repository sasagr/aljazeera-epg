name: Generate Al Jazeera EPG

# Rebuilds aljazeera.xml from the Al Jazeera schedule page and commits it when it changes.
on:
  schedule:
    - cron: "20 */6 * * *"   # every 6 hours (UTC), offset so it isn't on the hour with everyone else
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["generate.py", ".github/workflows/epg.yml"]

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate aljazeera.xml
        run: python generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain aljazeera.xml)" ]; then
            git add aljazeera.xml
            git commit -m "Update Al Jazeera EPG ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "aljazeera.xml unchanged — nothing to commit."
          fi
